name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUSTC_BOOTSTRAP: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Check Formatting
      run: cargo fmt -- --check
    - name: Clippy
      run: cargo clippy -- -D warnings -D clippy::all -D clippy::correctness -D clippy::suspicious -D clippy::complexity -D clippy::perf -D clippy::style -D clippy::cargo -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::undocumented_unsafe_blocks -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro
    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin
    - name: Run Tests & Coverage
      run: cargo tarpaulin --out Xml --fail-under 100 --engine llvm --timeout 300 -- --test-threads=1
    - name: Doc tests
      run: cargo rustdoc -- -D warnings -D missing_docs
