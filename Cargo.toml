[package]
name = "migratory"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["Samuel Marks"]
description = "An open-source, 100% compatible replica of Vagrant."
license = "CC0 OR MIT OR Apache-2.0"
repository = "https://github.com/SamuelMarks/migratory"
keywords = ["vagrant", "virtualization", "devops", "reproducible", "hypervisor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
clap = { version = "4.6", default-features = false, features = ["derive", "help", "std", "usage"] }
clap_complete = "4.6"
colored = "3.1"
derive_more = { version = "2.1", default-features = false, features = ["display", "error", "from"] }
fd-lock = "4.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
indicatif = { version = "0.18", default-features = false }
md-5 = { version = "0.11", default-features = false }
notify = "8.2"
regex = { version = "1.13", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
ssh2 = "0.9"
tar = { version = "0.4", default-features = false }
tempfile = "3.27"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
uuid = { version = "1.25", default-features = false, features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2"
atty = "0.2"
httpmock = { version = "0.8", default-features = false }
tempfile = "3.27"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
missing_docs_in_private_items = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
clone_on_ref_ptr = "deny"
empty_line_after_outer_attr = "deny"
explicit_into_iter_loop = "deny"
flat_map_option = "deny"
manual_assert = "deny"
match_same_arms = "deny"
needless_borrow = "deny"
redundant_closure = "deny"
redundant_static_lifetimes = "deny"
semicolon_if_nothing_returned = "deny"
single_match_else = "deny"
unused_async = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
cloned_instead_of_copied = "deny"
default_trait_access = "deny"
expl_impl_clone_on_copy = "deny"
filter_map_next = "deny"
fn_params_excessive_bools = "deny"
if_then_some_else_none = "deny"
inefficient_to_string = "deny"
macro_use_imports = "deny"
manual_is_ascii_check = "deny"
match_bool = "deny"
mut_mut = "deny"
naive_bytecount = "deny"
needless_bitwise_bool = "deny"
range_minus_one = "deny"
range_plus_one = "deny"
same_functions_in_if_condition = "deny"
str_split_at_newline = "deny"
string_add_assign = "deny"
unnecessary_join = "deny"
zero_sized_map_values = "deny"
collapsible_if = "deny"
needless_raw_string_hashes = "deny"
missing_const_for_thread_local = "deny"
io_other_error = "deny"
explicit_iter_loop = "deny"
needless_continue = "deny"
ptr_as_ptr = "deny"
unused_unit = "deny"
unnecessary_box_returns = "deny"
manual_string_new = "deny"
manual_clamp = "deny"
manual_instant_elapsed = "deny"
manual_is_power_of_two = "deny"
manual_ok_or = "deny"
trivially_copy_pass_by_ref = "deny"
case_sensitive_file_extension_comparisons = "deny"
stable_sort_primitive = "deny"
ref_binding_to_reference = "deny"
redundant_else = "deny"
match_wild_err_arm = "deny"
match_wildcard_for_single_variants = "deny"
unnested_or_patterns = "deny"
bool_to_int_with_if = "deny"
borrow_as_ptr = "deny"
clear_with_drain = "deny"
comparison_to_empty = "deny"
derive_partial_eq_without_eq = "deny"
doc_link_with_quotes = "deny"
double_comparisons = "deny"
equatable_if_let = "deny"
explicit_auto_deref = "deny"
get_first = "deny"
implicit_saturating_sub = "deny"
iter_filter_is_ok = "deny"
iter_filter_is_some = "deny"
iter_kv_map = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
large_digit_groups = "deny"
large_futures = "deny"
manual_bits = "deny"
manual_filter = "deny"
manual_filter_map = "deny"
manual_find = "deny"
manual_find_map = "deny"
manual_flatten = "deny"
manual_main_separator_str = "deny"
manual_range_contains = "deny"
manual_rem_euclid = "deny"
manual_retain = "deny"
manual_slice_size_calculation = "deny"
manual_split_once = "deny"
manual_str_repeat = "deny"
manual_while_let_some = "deny"
match_as_ref = "deny"
match_like_matches_macro = "deny"
mut_mutex_lock = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_match = "deny"
needless_option_as_deref = "deny"
needless_option_take = "deny"
needless_pub_self = "deny"
needless_raw_strings = "deny"
no_effect_underscore_binding = "deny"
non_ascii_literal = "deny"
non_canonical_clone_impl = "deny"
non_canonical_partial_ord_impl = "deny"
option_filter_map = "deny"
option_map_unit_fn = "deny"
option_option = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_allocation = "deny"
redundant_clone = "deny"
redundant_feature_names = "deny"
ref_as_ptr = "deny"
seek_from_current = "deny"
seek_to_start_instead_of_rewind = "deny"
